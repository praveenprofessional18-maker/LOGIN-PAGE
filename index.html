<!DOCTYPE html>
<html>
<head>
<title>Game Login</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  width: 110%;
  height: 110%;
  background: url('https://i.pinimg.com/1200x/0d/ad/a1/0dada1304d2febe68713b744d347d6de.jpg') no-repeat center center;
  background-size: cover;
  animation: moveBg 20s infinite alternate ease-in-out;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

@keyframes moveBg {
  0% { transform: scale(1); }
  100% { transform: scale(1.1) translate(-20px, -20px); }
}

.container {
  width: 800px;
  height: 420px;
  display: flex;
  border-radius: 15px;
  overflow: hidden;
}

.left {
  width: 50%;
  background: url('https://images.unsplash.com/photo-1713630019375-f483a9729a8b') no-repeat center;
  background-size: cover;
  color: white;
  padding: 30px;
  position: relative;
}

.left::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.right {
  width: 50%;
  background: linear-gradient(to bottom right, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  text-align: center;
  color: white;
  width: 250px;
}

input {
  display: block;
  margin: 10px auto;
  padding: 10px;
  width: 100%;
  border-radius: 20px;
  border: none;
}

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border-radius: 20px;
  border: none;
  background: white;
  cursor: pointer;
}

#msg { margin-top: 10px; }
</style>
</head>

<body>

<div class="container">

<div class="left">
  <h1>3DM GAME</h1>
  <p>Secure Gaming Portal 🔐</p>
</div>

<div class="right">
<div class="box">

<h2>Sign In</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<input type="text" id="secureKey" placeholder="Secure Key">

<button onclick="login()">LOGIN</button>

<p id="msg"></p>

</div>
</div>

</div>

<script>
let attempts = 0;


function caesarEncrypt(str, shift){
  return str.split('').map(c=>{
    if(/[a-z]/i.test(c)){
      let code = c.charCodeAt(0);
      let base = code >= 65 && code <= 90 ? 65 : 97;
      return String.fromCharCode(((code-base+shift)%26)+base);
    }
    return c;
  }).join('');
}


function caesarDecrypt(str, shift){
  return str.split('').map(c=>{
    if(/[a-z]/i.test(c)){
      let code = c.charCodeAt(0);
      let base = code >= 65 && code <= 90 ? 65 : 97;
      return String.fromCharCode(((code-base-shift+26)%26)+base);
    }
    return c;
  }).join('');
}


function secureEncode(str){
  return btoa(caesarEncrypt(str, 5));
}


function secureDecode(str){
  return caesarDecrypt(atob(str), 5);
}


const STORED_EMAIL = "eHl6aWpzeW5AbHJmcW4uaHRy";
const STORED_PASS  = "SUZXUE1aUkZT";
const STORED_KEY   = "NEZHSDRKSUlfN1hJ";

function login(){
  let e = document.getElementById("email").value;
  let p = document.getElementById("password").value;
  let k = document.getElementById("secureKey").value;
  let m = document.getElementById("msg");

  if(attempts >= 3){
    m.style.color="red";
    m.innerHTML="Account Locked ❌";
    return;
  }

  
  let realEmail = secureDecode(STORED_EMAIL);
  let realPass  = secureDecode(STORED_PASS);
  let realKey   = secureDecode(STORED_KEY);

  
  if(e === realEmail && p === realPass){
    if(k === realKey){
      m.style.color="green";
      m.innerHTML="Access Granted 🚀";
      setTimeout(()=>{
        window.location.href="https://poki.com/";
      },1000);
    } else {
      m.style.color="orange";
      m.innerHTML="Invalid Secure Key!";
      attempts++;
    }
  } else {
    m.style.color="red";
    m.innerHTML="Wrong Credentials!";
    attempts++;
  }
}
</script>

</body>
</html>
